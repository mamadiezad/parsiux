name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node dist/src/cli.js design "فروشگاه اینترنتی" --stack nextjs --output .
      - run: node dist/src/cli.js audit .
      - run: npx playwright install --with-deps chromium
      - run: node dist/src/cli.js visual tests/fixtures/rtl-good.html --output /tmp/parsiux-visual-report --strict
